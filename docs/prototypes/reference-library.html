<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHC Reference Library — prototype</title>
<style>body{font:16px system-ui;margin:0;background:#f4f8f5;color:#17382d}header{background:#086846;color:white;padding:24px}main{max-width:850px;margin:auto;padding:20px}input,select,button{font:inherit;padding:10px;border:1px solid #9ab6aa;border-radius:8px;background:white;color:inherit}input{width:100%;box-sizing:border-box}section{background:white;border:1px solid #d8e5df;border-radius:12px;padding:16px;margin:12px 0}h2{font-size:18px;margin:0 0 8px}label{display:block;margin:12px 0}small{color:#52675e}button{cursor:pointer}button[aria-pressed=true]{background:#086846;color:white}</style>
<header><strong>PHC · Doctor workspace</strong><h1>Reference Library / संदर्भ पुस्तकालय</h1></header>
<main><p>Local prototype only. No authentication, patient data, book contents or clinical recommendations. Catalog entries are candidates pending rights verification.</p><label>Search / खोजें<input id="q" type="search" placeholder="Kent, केंट, Organon…"></label><label>Category / श्रेणी<select id="category"><option value="">All / सभी</option><option>Repertory</option><option>Materia Medica</option><option>History</option></select></label><label><input id="saved" type="checkbox" style="width:auto"> Bookmarks only / केवल बुकमार्क</label><p id="count" role="status"></p><div id="results"></div></main>
<script>
const catalog=[{id:'kent',title:"Repertory of the Homoeopathic Materia Medica",hi:"केंट रिपर्टरी",author:"J. T. Kent",category:"Repertory"},{id:'boericke',title:"Pocket Manual of Homoeopathic Materia Medica",hi:"बोरिक मेटेरिया मेडिका",author:"William Boericke",category:"Materia Medica"},{id:'organon',title:"Organon of Medicine",hi:"ऑर्गेनॉन ऑफ मेडिसिन",author:"Samuel Hahnemann",category:"History"},{id:'boenninghausen',title:"Therapeutic Pocket Book",hi:"बोनिंगहाउसेन रिपर्टरी",author:"C. von Bönninghausen",category:"Repertory"},{id:'clarke',title:"A Dictionary of Practical Materia Medica",hi:"क्लार्क मेटेरिया मेडिका",author:"J. H. Clarke",category:"Materia Medica"}];
const q=document.getElementById('q'),category=document.getElementById('category'),saved=document.getElementById('saved'),results=document.getElementById('results');const bookmarks=new Set();
function render(){const term=q.value.normalize('NFC').trim().toLocaleLowerCase();const matches=catalog.filter(b=>(!category.value||category.value===b.category)&&(!saved.checked||bookmarks.has(b.id))&&[b.title,b.hi,b.author,b.category].join(' ').normalize('NFC').toLocaleLowerCase().includes(term));results.replaceChildren();document.getElementById('count').textContent=matches.length+' catalog entries';for(const b of matches){const card=document.createElement('section'),heading=document.createElement('h2'),desc=document.createElement('p'),status=document.createElement('p'),btn=document.createElement('button');heading.textContent=b.title+' / '+b.hi;desc.textContent=b.author+' · '+b.category;status.textContent='Edition, rights and Hindi text pending verification.';btn.textContent=bookmarks.has(b.id)?'Remove bookmark':'Bookmark';btn.setAttribute('aria-pressed',String(bookmarks.has(b.id)));btn.onclick=()=>{bookmarks.has(b.id)?bookmarks.delete(b.id):bookmarks.add(b.id);render()};card.append(heading,desc,status,btn);results.append(card)}}
q.addEventListener('input',render);category.addEventListener('change',render);saved.addEventListener('change',render);render();
</script></html>
